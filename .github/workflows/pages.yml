# Checks that the tables are valid on every push. The site itself is served from the docs/ folder
# (Settings > Pages > Deploy from a branch > main > /docs), so run tools/build_db.py and commit docs/assay_db.json.
name: Check data
on:
  push: {branches: [main]}
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/build_db.py --out /tmp/assay_db_check.json
